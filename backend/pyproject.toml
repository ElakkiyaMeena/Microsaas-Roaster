[project]
name = "assignment-roaster-backend"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "B008",  # FastAPI Depends/Query/File in argument defaults
    "S105",  # false positives on token-type constants
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local ``alembic/`` migrations folder must not make the alembic package look first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
