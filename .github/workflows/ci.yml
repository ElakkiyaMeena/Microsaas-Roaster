name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assignment_roaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assignment_roaster_test
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      RATE_LIMIT_ENABLED: "false"
      UPLOAD_DIR: ./uploads
      # OPENAI_API_KEY intentionally not set: tests must mock OpenAI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Dependency audit (pip-audit)
        continue-on-error: false
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Dependency audit (npm)
        continue-on-error: false
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
        env:
          CI: "true"
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q
      - name: Build images
        run: docker compose build
